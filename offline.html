<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Offline — Recipe Chest</title>
<meta name="theme-color" content="#c7541a">
<style>
  body {
    margin: 0;
    background: #faf6f0;
    color: #2a1a0f;
    font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    text-align: center;
    padding: 2rem;
  }
  .box { max-width: 420px; }
  .icon { font-size: 3rem; margin-bottom: 0.75rem; }
  h1 {
    font-family: Georgia, serif;
    font-weight: 600;
    font-size: 1.6rem;
    margin: 0 0 0.5rem;
    color: #5a3a22;
  }
  p {
    color: #6b5d4d;
    font-size: 0.95rem;
    line-height: 1.5;
    margin: 0 0 1.25rem;
  }
  button {
    font: inherit;
    font-size: 0.9rem;
    font-weight: 600;
    background: #c7541a;
    color: #fff;
    border: none;
    padding: 0.7rem 1.5rem;
    border-radius: 24px;
    cursor: pointer;
  }
  button:hover { background: #a34413; }
</style>
</head>
<body>
  <div class="box">
    <div class="icon">📖</div>
    <h1>Recipe Chest is offline</h1>
    <p>You're offline. Reconnect to see your recipes.</p>
    <button onclick="location.reload()">Try again</button>
  </div>
</body>
</html>
